on/json,.json" hidden></div><p class="notice">データはこの端末内に保存されます。大切な履歴は定期的にバックアップしてください。</p><div id="records"><p class="hint">まだ記録がありません</p></div></section><section id="snapshot"><div class="snap-controls"><button type="button" id="back">← 一覧に戻る</button><span>この画面をスクショで保存</span></div><div id="snap-body"></div></section></main><dialog id="viewer"><button id="close" aria-label="閉じる">×</button><img id="large" alt="完成写真"></dialog><dialog id="save-confirm" aria-labelledby="save-confirm-message"><p id="save-confirm-message">この設定を記録しますか？</p><div class="confirm-actions"><button id="cancel-save" type="button" autofocus>キャンセル</button><button id="confirm-save" type="button">記録する</button></div></dialog><div id="save-status" class="hidden" role="status" aria-live="polite"></div><script>
const $=id=>document.getElementById(id);

// Resolve only after the transaction commits, never just after a request succeeds.

try{
  const open=indexedDB.open('laser-log-v02',1);

const MAX_PHOTOS=3;let addingPhotos=false;
$('add').onclick=()=>{if(!addingPhotos&&selected.length<MAX_PHOTOS)$('file').click()};
$('file').onchange=async e=>{
  if(addingPhotos)return;

  addingPhotos=true;$('add').disabled=true;
  try{
    let overLimit=false;
    for(const file of files){
      if(!file.type.startsWith('image/'))continue;
      if(selected!==target)break;
      if(selected.length>=MAX_PHOTOS){overLimit=true;break}
      try{
        const photo=await shrink(file);
        if(selected!==target)break;
        if(selected.length>=MAX_PHOTOS){overLimit=true;break}

function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject()},'image/jpeg',.8)};img.onerror=()=>{URL.revokeObjectURL(url);reject()};img.src=url})}function makePhoto(blob,remove){const box=document.createElement('div');box.className='thumb';const img=document.createElement('img'),url=URL.createObjectURL(blob);img.src=url;img.onload=()=>URL.revokeObjectURL(url);img.onclick=()=>{const big=URL.createObjectURL(blob);$('large').src=big;$('large').onload=()=>URL.revokeObjectURL(big);$('viewer').showModal()};box.append(img);if(remove){const b=document.createElement('button');b.type='button';b.className='remove';b.textContent='×';b.onclick=remove;box.append(b)}return box}function drawSelected(){

}$('back').onclick=()=>{document.body.classList.remove('snapshot-mode');switchTab('history')};function switchTab(tab){$('entry-panel').classList.toggle('hidden',tab!=='entry');$('history-panel').classList.toggle('hidden',tab!=='history');$('tab-entry').classList.toggle('active',tab==='entry');$('tab-history').classList.toggle('active',tab==='history');if(tab==='entry')resizeNotes()} $('tab-entry').onclick=()=>switchTab('entry');$('tab-history').onclick=()=>switchTab('history');$('search').oninput=()=>drawRecords(allRecords);$('cancel-edit').onclick=()=>{editingId=null;$('editbar').classList.add('hidden');$('save').textContent='設定を記録する';$('form').reset();selected=[];drawSelected()};$('close').onclick=()=>$('viewer').close();$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').close()};// Saving is available only through the save button, never implicit form submission.

$('save').onclick=async e=>{

function drawRecords(items){const q=$('search').value.trim().toLowerCase();$('records').replaceChildren();const found=items.filter(r=>r.material.toLowerCase().includes(q));if(!found.length){const p=document.createElement('p');p.className='hint';p.textContent=q?'該当する記録がありません':'まだ記録がありません';$('records').append(p)}for(const r of found){const section=document.createElement('section');section.className='record';const head=document.createElement('div');head.className='head';const title=document.createElement('strong');title.textContent=r.material;const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=async()=>{if(confirm('この記録と写真を削除しますか？')){try{await writeRecords(store=>store.delete(r.id));await render()}catch(error){reportError('記録を削除できませんでした。もう一度お試しください。',error)}}};const view=document.createElement('button');view.className='secondary';view.textContent='スクショ';view.onclick=()=>showSnapshot(r);const edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>{editingId=r.id;for(const key of ['material','power','speed','passes','density','mode'])$(key).value=r[key];$('notes').value=typeof r.notes==='string'?r.notes:'';selected=[...(r.photos||[])];drawSelected();$('editbar').classList.remove('hidden');$('save').textContent='変更を保存する';switchTab('entry');window.scrollTo(0,0)};const actions=document.createElement('div');actions.style.display='flex';actions.style.gap='4px';actions.append(view,edit,del);head.append(title,actions);const meta=document.createElement('div');meta.className='meta';meta.textContent=`電源 ${r.power} ｜ 速度 ${r.speed} ｜ 加工 ${r.passes}回 ｜ 密度 ${r.density} ｜ ${r.mode}`;const date=document.createElement('small');date.textContent=r.date;const photos=document.createElement('div');photos.className='photos';for(const blob of r.photos||[])photos.append(makePhoto(blob));section.append(head,meta,date,photos);appendNotes(section,r);$('records').append(section)}}
function appendNotes(root,r){

function blobToData(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
function dataToBlob(data){const parts=data.split(',');const mime=(parts[0].match(/data:(.*?);base64/)||[])[1]||'image/jpeg';const bytes=atob(parts[1]);const arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);return new Blob([arr],{type:mime})}
$('export').onclick=async()=>{try{const rows=[];for(const r of allRecords)rows.push({...r,photos:await Promise.all((r.photos||[]).map(blobToData))});const blob=new Blob([JSON.stringify({app:'Laser Log',version:1,records:rows})],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='laser-log-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){alert('バックアップ作成に失敗しました')}};
$('import').onclick=()=>$('backup-file').click();$('backup-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='Laser Log'||!Array.isArray(data.records)||data.records.length>10000)throw Error('形式が正しくありません');if(!confirm(`${data.records.length}件を復元します。現在の履歴と統合しますか？（同じIDは上書き）`))return;const rows=data.records.map(r=>{if(typeof r.id!=='string'||typeof r.material!=='string'||!Array.isArray(r.photos)||r.photos.some(p=>typeof p!=='string'||!p.startsWith('data:image/')))throw Error('不正なデータ');return {...r,photos:r.photos.map(dataToBlob)}});await writeRecords(store=>{for(const r of rows)store.put(r)});if(await render('復元は完了しましたが、履歴を読み込めませんでした。ページを再読み込みしてください。'))alert('復元しました')}catch(err){alert('バックアップを読み込めません: '+err.message)}finally{$('backup-file').value=''}};
function showSnapshot(r){const root=$('snap-body');root.replaceChildren();const title=document.createElement('h2');title.textContent=r.material;const date=document.createElement('div');date.className='snap-date';date.textContent=r.date;const grid=document.createElement('div');grid.className='snap-grid';for(const [label,value] of [['電源',r.power],['速度',r.speed],['加工回数',r.passes+'回'],['彫刻密度',r.density],['彫刻モード',r.mode]]){const cell=document.createElement('div');cell.className='snap-cell';const a=document.createElement('small');a.textContent=label;const b=document.createElement('strong');b.textContent=value;cell.append(a,b);grid.append(cell)}const photos=document.createElement('div');photos.className='snap-photos';for(const blob of r.photos){const img=document.createElement('img');const url=URL.createObjectURL(blob);img.src=url;img.onload=()=>URL.revokeObjectURL(url);photos.append(img)}root.append(title,date,grid,photos);appendNotes(root,r);document.body.classList.add('snapshot-mode');window.scrollTo(0,0)}
</script></body></html>
